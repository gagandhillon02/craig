apiVersion: v1
kind: Secret
metadata:
  name: craig-secrets
  namespace: {{ include "craig.namespace" . }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
  CRAIG_WEB__SESSION_SECRET: {{ .Values.secrets.webSessionSecret | quote }}
  CRAIG_FIELD_ENCRYPTION_KEY: {{ .Values.secrets.fieldEncryptionKey | quote }}
  CRAIG_REPORTING_FIELD_ENCRYPTION_KEY: {{ .Values.secrets.reportingFieldEncryptionKey | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.keycloak.adminPassword | quote }}
  CRAIG_INTAKE__CLIENT_SECRET: {{ .Values.secrets.intakeClientSecret | quote }}
  CRAIG_INTAKE__IP_HASH_SECRET: {{ .Values.secrets.intakeIpHashSecret | quote }}
  CRAIG_BACKEND_SERVICE_CLIENT_SECRET: {{ .Values.secrets.backendServiceClientSecret | quote }}
  {{- range $name, $value := .Values.actorKeys }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
